<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Base Palette -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <radialGradient id="glow-left" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7d8ba0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7d8ba0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-right" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f9bad" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#6b8578" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordmark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#b8c4d0"/>
    </linearGradient>

    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7d8ba0"/>
      <stop offset="50%" stop-color="#6b8494"/>
      <stop offset="100%" stop-color="#7fa392"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7d8ba0" stroke-opacity="0.035" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="320" fill="url(#bg-grad)"/>
  <rect width="1280" height="320" fill="url(#grid-pattern)"/>
  <rect width="1280" height="320" fill="url(#glow-left)"/>
  <rect width="1280" height="320" fill="url(#glow-right)"/>

  <!-- Outer Tech Border Frame -->
  <rect x="2" y="2" width="1276" height="316" fill="none" stroke="#334155" stroke-opacity="0.3" stroke-width="1" rx="10"/>
  <path d="M 12 28 L 12 12 L 28 12 M 1268 28 L 1268 12 L 1252 12 M 12 292 L 12 308 L 28 308 M 1268 292 L 1268 308 L 1252 308" stroke="#7d8ba0" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- ================= LEFT HAND SIDE: Emblem + Wordmark + Byline + Descriptor ================= -->
  <g transform="translate(45, 0)">
    
    <!-- Hexagonal Hitch Shield Emblem -->
    <g transform="translate(10, 40)">
      <!-- Regular hexagons: centre (85,95), circumradius == side length (86.603 outer, 77.365 inner) -->
      <polygon points="85,8.4 160,51.7 160,138.3 85,181.6 10,138.3 10,51.7" fill="#0f172a" fill-opacity="0.7" stroke="url(#emblem-grad)" stroke-width="2.6"/>
      <polygon points="85,17.64 152,56.32 152,133.68 85,172.36 18,133.68 18,56.32" fill="#07090e" stroke="#334155" stroke-width="1" opacity="0.8"/>

      <!-- Three-layer swingletree: one load in, doubletree, two singletrees, two more bars,
           six hitch points. Bars get dimmer and thinner with depth, so the hierarchy reads
           without another hue. The third layer hangs off the INNER ends: the hexagon only
           carries full width between y=56.3 and y=133.7, and narrows too fast above and
           below that to take a bar at the outer ends. -->

      <!-- Load: draught ring and trace into the doubletree's pivot -->
      <circle cx="34" cy="95" r="5.5" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="39.5" y1="95" x2="68" y2="95" stroke="#cbd5e1" stroke-width="1.8"/>

      <!-- Layer 1: doubletree, pivoting on the load -->
      <!-- solid, not url(#emblem-grad): a vertical line has a zero-width bounding box, so an
           objectBoundingBox gradient stroke renders nothing -->
      <line x1="68" y1="60" x2="68" y2="130" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="68" cy="95" r="3.5" fill="#cbd5e1"/>

      <!-- Couplings to the singletree pivots -->
      <line x1="68" y1="60" x2="92" y2="60" stroke="#9aa7b8" stroke-width="1.5"/>
      <line x1="68" y1="130" x2="92" y2="130" stroke="#9aa7b8" stroke-width="1.5"/>

      <!-- Layer 2: two singletrees -->
      <line x1="92" y1="42" x2="92" y2="78" stroke="#9aa7b8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="92" cy="60" r="2.6" fill="#cbd5e1"/>
      <line x1="92" y1="112" x2="92" y2="148" stroke="#9aa7b8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="92" cy="130" r="2.6" fill="#cbd5e1"/>

      <!-- Layer 2 outer ends terminate directly -->
      <line x1="92" y1="42" x2="112" y2="42" stroke="#7fa392" stroke-width="1.1"/>
      <circle cx="115" cy="42" r="3" fill="#16211f" stroke="#7fa392" stroke-width="1.2"/>
      <line x1="92" y1="148" x2="112" y2="148" stroke="#7fa392" stroke-width="1.1"/>
      <circle cx="115" cy="148" r="3" fill="#16211f" stroke="#7fa392" stroke-width="1.2"/>

      <!-- Layer 2 inner ends couple to a third layer: a delegate that delegates again -->
      <line x1="92" y1="78" x2="116" y2="78" stroke="#7d8ba0" stroke-width="1.2"/>
      <line x1="92" y1="112" x2="116" y2="112" stroke="#7d8ba0" stroke-width="1.2"/>

      <!-- Layer 3 -->
      <line x1="116" y1="68" x2="116" y2="88" stroke="#7d8ba0" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="116" cy="78" r="2.2" fill="#9aa7b8"/>
      <line x1="116" y1="102" x2="116" y2="122" stroke="#7d8ba0" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="116" cy="112" r="2.2" fill="#9aa7b8"/>

      <line x1="116" y1="68" x2="134" y2="68" stroke="#7fa392" stroke-width="1.1"/>
      <circle cx="137" cy="68" r="2.6" fill="#16211f" stroke="#7fa392" stroke-width="1.1"/>
      <line x1="116" y1="88" x2="134" y2="88" stroke="#7fa392" stroke-width="1.1"/>
      <circle cx="137" cy="88" r="2.6" fill="#16211f" stroke="#7fa392" stroke-width="1.1"/>
      <line x1="116" y1="102" x2="134" y2="102" stroke="#7fa392" stroke-width="1.1"/>
      <circle cx="137" cy="102" r="2.6" fill="#16211f" stroke="#7fa392" stroke-width="1.1"/>
      <line x1="116" y1="122" x2="134" y2="122" stroke="#7fa392" stroke-width="1.1"/>
      <circle cx="137" cy="122" r="2.6" fill="#16211f" stroke="#7fa392" stroke-width="1.1"/>
    </g>

    <!-- Wordmark & Left Text Stack -->
    <g transform="translate(195, 0)">
      <!-- Wordmark -->
      <text x="0" y="108" fill="url(#wordmark-grad)" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="900" letter-spacing="-1.5">Swingle</text>

      <!-- Accent Line (clean, no stray dot beneath 'g') -->
      <path d="M 4 120 L 325 120" stroke="url(#wordmark-grad)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Byline: set over two lines so it keeps 22px rather than shrinking to clear the divider at x=570 -->
      <text x="0" y="150" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="0.2">Don't switch harnesses</text>
      <text x="0" y="176" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="0.2">to switch models</text>
      <text x="0" y="202" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.1">Dispatch to the agent CLIs on your machine</text>

      <!-- Direct Descriptor Line -->
      <text x="0" y="238" fill="#7f9bad" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.3">Local CLI · harness-to-harness connections</text>
    </g>

  </g>

  <!-- Central Vertical Divider -->
  <line x1="570" y1="45" x2="570" y2="275" stroke="#334155" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ================= RIGHT HAND SIDE: Peer Harness Nodes + Model Effort Scale ================= -->
  <g transform="translate(615, 0)">
    
    <!-- Six Peer Harness Nodes (2x3 Grid) -->
    <!-- Row 1 -->
    <g transform="translate(0, 65)">
      <!-- Claude Code -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="44" rx="8" fill="#090d16" stroke="#6f7690" stroke-width="1.2"/>
        <circle cx="20" cy="22" r="4.5" fill="#8b90a8" filter="url(#neon-glow)"/>
        <text x="34" y="26" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Claude Code</text>
      </g>

      <!-- Codex -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="180" height="44" rx="8" fill="#090d16" stroke="#7fa392" stroke-width="1.2"/>
        <circle cx="20" cy="22" r="4.5" fill="#7fa392" filter="url(#neon-glow)"/>
        <text x="34" y="26" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Codex</text>
      </g>

      <!-- Antigravity CLI -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="180" height="44" rx="8" fill="#090d16" stroke="#7188a6" stroke-width="1.2"/>
        <circle cx="18" cy="22" r="4.5" fill="#7188a6" filter="url(#neon-glow)"/>
        <text x="30" y="26" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Antigravity CLI</text>
      </g>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 128)">
      <!-- opencode -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="44" rx="8" fill="#090d16" stroke="#a89566" stroke-width="1.2"/>
        <circle cx="20" cy="22" r="4.5" fill="#a89566" filter="url(#neon-glow)"/>
        <text x="34" y="26" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">opencode</text>
      </g>

      <!-- Grok -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="180" height="44" rx="8" fill="#090d16" stroke="#a3808f" stroke-width="1.2"/>
        <circle cx="20" cy="22" r="4.5" fill="#a3808f" filter="url(#neon-glow)"/>
        <text x="34" y="26" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Grok</text>
      </g>

      <!-- Pi -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="180" height="44" rx="8" fill="#090d16" stroke="#7f9bad" stroke-width="1.2"/>
        <circle cx="20" cy="22" r="4.5" fill="#7f9bad" filter="url(#neon-glow)"/>
        <text x="34" y="26" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Pi</text>
      </g>
    </g>

    <!-- Minimal Model Effort Ramp Bar -->
    <g transform="translate(0, 198)">
      <rect x="0" y="0" width="580" height="50" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>

      <!-- Light Tier Dot & Label -->
      <g transform="translate(40, 25)">
        <circle cx="0" cy="0" r="5" fill="#7f9bad" filter="url(#neon-glow)"/>
        <text x="14" y="4" fill="#7f9bad" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">light</text>
      </g>

      <!-- Ramp Conduit 1 -->
      <line x1="115" y1="25" x2="235" y2="25" stroke="#7f9bad" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

      <!-- Medium Tier Dot & Label -->
      <g transform="translate(265, 25)">
        <circle cx="0" cy="0" r="5" fill="#7fa392" filter="url(#neon-glow)"/>
        <text x="14" y="4" fill="#7fa392" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">medium</text>
      </g>

      <!-- Ramp Conduit 2 -->
      <line x1="360" y1="25" x2="465" y2="25" stroke="#7fa392" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

      <!-- Heavy Tier Dot & Label -->
      <g transform="translate(495, 25)">
        <circle cx="0" cy="0" r="5" fill="#a89566" filter="url(#neon-glow)"/>
        <text x="14" y="4" fill="#a89566" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">heavy</text>
      </g>
    </g>

  </g>
</svg>
